server {
    listen 80;
    server_name app-haji-monitoring.my.id;

    client_max_body_size 15M;

    # Logging
    access_log /var/log/nginx/smarthajj_access.log;
    error_log /var/log/nginx/smarthajj_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Penanganan file statis jika dibutuhkan
    location /static {
        alias /www/wwwroot/app-haji-monitoring.my.id/static;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
